<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff7ab8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <title>Crash Lab 碰撞实验场</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-block">
        <div class="hud-speed"><span id="hudSpeed">0</span><em>km/h</em></div>
        <div class="hud-row"><span class="hud-label">车损</span><div class="bar"><i id="barDamage"></i></div><span id="txtDamage">0%</span></div>
        <div class="hud-row"><span class="hud-label">引擎</span><div class="bar"><i id="barEngine"></i></div><span id="txtEngine">100%</span></div>
        <div class="hud-row"><span class="hud-label">轮胎</span><span id="txtWheels">完好</span></div>
        <div class="hud-row" id="timeRow" style="display:none"><span class="hud-label">剩余</span><span id="txtTime">--</span></div>
        <div class="hud-score">得分 <span id="hudScore">0</span><em>最佳 <span id="hudBest">0</span></em></div>
      </div>
      <div id="fps" class="fps">--</div>
      <div id="msgline" class="msg-line"></div>
    </div>

    <!-- 爆炸等重大提示 -->
    <div id="banner"></div>

    <!-- 腾空时的特技操作提示 -->
    <div id="airhint" class="air-hint">油门 前空翻 · 刹车 后空翻 · 方向键 横向翻转</div>

    <!-- 屏幕控制 -->
    <div id="controls" class="hidden">
      <div class="pad pad-action">
        <button class="btn round fire hide" id="btnFire" data-tap="fire">开炮</button>
      </div>
      <div class="pad pad-left">
        <button class="btn round big" data-hold="steerL">◀</button>
        <button class="btn round big" data-hold="steerR">▶</button>
      </div>
      <div class="pad pad-right">
        <button class="btn round big ghost" data-hold="handbrake">P</button>
        <button class="btn round big brake" data-hold="brake">B</button>
        <button class="btn round big gas" data-hold="throttle">▲</button>
      </div>
    </div>

    <!-- 右上角功能键 -->
    <div id="tools" class="hidden">
      <button class="btn round primary" data-tap="flip">翻正</button>
      <button class="btn round" data-tap="camera">视角</button>
      <button class="btn round" data-tap="slowmo">慢放</button>
      <button class="btn round" data-tap="heavy">落锤</button>
      <button class="btn round danger" data-tap="reset">重置</button>
      <button class="btn round" data-tap="menu">菜单</button>
    </div>

    <!-- 主菜单 -->
    <div id="menu" class="overlay">
      <div class="panel">
        <h1 class="logo">CRASH<span>LAB</span></h1>
        <p class="sub">碰撞实验场</p>
        <button class="btn wide primary" data-nav="play">开始游戏</button>
        <button class="btn wide" data-nav="garage">车辆选择</button>
        <button class="btn wide" data-nav="settings">设置</button>
        <button class="btn wide ghost" data-nav="quit">退出</button>
        <p class="tip">电脑用 W A S D 驾驶，空格手刹，F 翻正，C 切视角，T 慢放，R 重置，H 落锤</p>
        <p class="tip">腾空时按住油门做前空翻，按刹车做后空翻，方向键做侧翻，落地结算特技分</p>
      </div>
    </div>

    <!-- 车辆选择 -->
    <div id="garage" class="overlay hidden">
      <div class="panel">
        <h2>选择车辆</h2>
        <div class="cards">
          <button class="card selected" data-vehicle="normal">
            <div class="thumb thumb-normal"></div>
            <h3>普通测试轿车</h3>
            <p>稳定 · 速度快 · 车身较重</p>
          </button>
          <button class="card" data-vehicle="star">
            <div class="thumb thumb-star"></div>
            <h3>星星小车</h3>
            <p>轻快 · 星星主题 · 容易翻滚</p>
          </button>
          <button class="card" data-vehicle="monster">
            <div class="thumb thumb-monster"></div>
            <h3>大脚越野车</h3>
            <p>巨轮 · 高底盘 · 碾过障碍</p>
          </button>
          <button class="card" data-vehicle="bus">
            <div class="thumb thumb-bus"></div>
            <h3>城市小巴</h3>
            <p>超长 · 很重 · 推土机式撞击</p>
          </button>
          <button class="card" data-vehicle="sport">
            <div class="thumb thumb-sport"></div>
            <h3>红色跑车</h3>
            <p>最快 · 最轻 · 加速排气喷火</p>
          </button>
          <button class="card" data-vehicle="tank">
            <div class="thumb thumb-tank"></div>
            <h3>坦克</h3>
            <p>重装 · 开炮打塌建筑</p>
          </button>
        </div>
        <button class="btn wide primary" data-nav="play">进入试验场</button>
        <button class="btn wide ghost" data-nav="menu">返回</button>
      </div>
    </div>

    <!-- 设置 -->
    <div id="settings" class="overlay hidden">
      <div class="panel">
        <h2>设置</h2>
        <div class="setting">
          <label>音量</label>
          <input id="setVolume" type="range" min="0" max="100" value="80" />
        </div>
        <div class="setting">
          <label>画质</label>
          <div class="seg" id="setQuality">
            <button data-q="0">低</button>
            <button data-q="1" class="on">中</button>
            <button data-q="2">高</button>
          </div>
        </div>
        <div class="setting">
          <label>帧率</label>
          <div class="seg" id="setFps">
            <button data-f="30">30</button>
            <button data-f="60" class="on">60</button>
          </div>
        </div>
        <div class="setting">
          <label>出生点</label>
          <div class="seg" id="setSpawn">
            <button data-s="0" class="on">跑道</button>
            <button data-s="1">跳台</button>
            <button data-s="2">坠台</button>
            <button data-s="3">重物</button>
            <button data-s="4">保龄</button>
            <button data-s="5">砖墙</button>
            <button data-s="6">波浪</button>
            <button data-s="7">圆环</button>
            <button data-s="8">水池</button>
            <button data-s="9">车库</button>
            <button data-s="10">山林</button>
            <button data-s="11">城市</button>
          </div>
        </div>
        <div class="setting">
          <label>家长设置 时长</label>
          <div class="seg" id="setLimit">
            <button data-limit="15">15 分</button>
            <button data-limit="30" class="on">30 分</button>
            <button data-limit="60">60 分</button>
            <button data-limit="0">不限</button>
          </div>
        </div>
        <p class="tip">修改时长需要家长密码。到点会自动锁屏，解锁同样要密码。</p>
        <button class="btn wide ghost" data-nav="menu">返回</button>
      </div>
    </div>

    <!-- 家长密码 -->
    <div id="pinpad" class="overlay hidden">
      <div class="panel pin-panel">
        <h2 id="pinTitle">家长验证</h2>
        <p class="sub" id="pinHint">请输入六位密码</p>
        <div class="pin-dots" id="pinDots">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="pin-keys" id="pinKeys">
          <button class="btn" data-pin="1">1</button>
          <button class="btn" data-pin="2">2</button>
          <button class="btn" data-pin="3">3</button>
          <button class="btn" data-pin="4">4</button>
          <button class="btn" data-pin="5">5</button>
          <button class="btn" data-pin="6">6</button>
          <button class="btn" data-pin="7">7</button>
          <button class="btn" data-pin="8">8</button>
          <button class="btn" data-pin="9">9</button>
          <button class="btn ghost" data-pin="clear">清空</button>
          <button class="btn" data-pin="0">0</button>
          <button class="btn ghost" data-pin="back">退格</button>
        </div>
        <p class="pin-error" id="pinError"></p>
      </div>
    </div>

    <!-- 旋转提示 -->
    <div id="rotate" class="overlay hidden">
      <div class="panel"><h2>请横屏游玩</h2><p class="sub">把手机转成横向更好玩</p></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
